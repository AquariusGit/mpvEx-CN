name: Make release

permissions:
  contents: write

on:
#  push:
#    tags:
#      - 'v[0-9]+.[0-9]+.[0-9]+'
#      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

jobs:
  release-for-github:
    name: "Release for GitHub"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # 👈 加上这行，递归拉取所有依赖子模块

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build standard release with Gradle
        run: ./gradlew assembleStandardRelease --stacktrace

      - name: Get tag name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # 如果是 Tag 触发，使用 Tag 名 (如 v1.0.0)
            TAG_NAME=$(basename $GITHUB_REF)
          else
            # 如果是手动触发/分支触发，使用 Commit 短 Hash (如 dev-a1b2c3d)
            TAG_NAME="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION_TAG=$TAG_NAME" >> $GITHUB_ENV

      - name: Verify build output
        run: |
          STANDARD_RELEASE_DIR="app/build/outputs/apk/standard/release"
          
          if [ ! -d "$STANDARD_RELEASE_DIR" ]; then
            echo "Standard release directory does not exist!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi
          
          echo "Standard release APKs:"
          ls -lah "$STANDARD_RELEASE_DIR"

      - name: Sign APKs
        run: |
          set -e
          STANDARD_RELEASE_DIR="app/build/outputs/apk/standard/release"
          
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > release.keystore
          
          standard_apks=("universal" "arm64-v8a" "armeabi-v7a")
          for abi in "${standard_apks[@]}"; do
            apk="$STANDARD_RELEASE_DIR/app-standard-${abi}-release-unsigned.apk"
            if [ ! -f "$apk" ]; then
              echo "Unsigned standard APK for $abi not found: $apk"
              ls -lah "$STANDARD_RELEASE_DIR"
              rm release.keystore
              exit 1
            fi
            
            signed_apk="${apk/-unsigned/}"
            
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$signed_apk" \
              "$apk"
            
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify "$signed_apk"
            rm "$apk"
          done
          
          rm release.keystore
          echo "Signed Standard APKs:"
          ls -lh "$STANDARD_RELEASE_DIR"/app-standard-*-release.apk

      - name: Copy build artifacts
        run: |
          set -euo pipefail
          
          standard_apks=("universal" "arm64-v8a" "armeabi-v7a")
          for abi in "${standard_apks[@]}"; do
            src="app/build/outputs/apk/standard/release/app-standard-${abi}-release.apk"
            dst="mpvEx-${abi}-${VERSION_TAG}.apk"
            if [ ! -f "$src" ]; then
              echo "::error file=$src::Signed standard APK for $abi was not found"
              exit 1
            fi
            cp "$src" "$dst"
            checksum=$(sha256sum "$dst" | awk '{ print $1 }')
            varname="apk_${abi//-/_}_sha256"
            echo "$varname=$checksum" >> "$GITHUB_ENV"
          done
          
          ls -lah mpvEx-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: mpvEx ${{ env.VERSION_TAG }}
          body: |
            ---
            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ env.apk_universal_sha256 }} |
            | arm64-v8a | ${{ env.apk_arm64_v8a_sha256 }} |
            | armeabi-v7a | ${{ env.apk_armeabi_v7a_sha256 }} |
          files: |
            mpvEx-universal-${{ env.VERSION_TAG }}.apk
            mpvEx-arm64-v8a-${{ env.VERSION_TAG }}.apk
            mpvEx-armeabi-v7a-${{ env.VERSION_TAG }}.apk
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
